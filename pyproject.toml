[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kkr-scout"
version = "0.1.0"
description = "Cricket scouting from uploaded match data"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sqlalchemy>=2.0,<3",
  "pydantic>=2.9,<3", "numpy>=2,<3", "scipy>=1.14,<2",
  "rapidfuzz>=3,<4", "psycopg[binary]>=3.2,<4", "alembic>=1.14,<2"
]

[project.optional-dependencies]
analysis = ["pandas>=2.2,<4", "numpy>=2,<3", "matplotlib>=3.9,<4", "rapidfuzz>=3,<4", "jupyterlab>=4,<5"]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
